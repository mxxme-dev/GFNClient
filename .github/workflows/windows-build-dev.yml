name: Build Windows x64 (dev)

on:
  push:
    branches: [ dev ]
  workflow_dispatch: {}

jobs:
  build-windows-x64:
    name: Build Windows x64 (dev)
    runs-on: windows-latest
    concurrency:
      group: windows-build-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout current commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Setup Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Ensure WiX Toolset
        run: choco install -y wixtoolset

      - name: Build native Windows x64 (Tauri)
        run: npx @tauri-apps/cli@latest build --target x86_64-pc-windows-msvc

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: tauri-bundle-windows-x64-${{ github.sha }}
          path: src-tauri/target/release/bundle/**
