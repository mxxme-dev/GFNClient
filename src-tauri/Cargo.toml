[package]
name = "opennow"
version = "0.0.18"
description = "OpenNOW - Open source GeForce NOW client"
authors = ["zortos293"]
edition = "2021"
default-run = "opennow"

[lib]
name = "opennow_lib"
crate-type = ["lib", "cdylib", "staticlib"]

# Tauri app binary (main)
[[bin]]
name = "opennow"
path = "src/main.rs"

# Native streamer binary (high-performance, hardware-accelerated)
[[bin]]
name = "gfn-streamer"
path = "src/bin/gfn_streamer/main.rs"
required-features = ["native-streamer"]


[build-dependencies]
tauri-build = { version = "2.0", features = [], optional = true }

[dependencies]
tauri = { version = "2.0", features = ["devtools"], optional = true }
tauri-plugin-shell = { version = "2.0", optional = true }
tauri-plugin-http = { version = "2.0", optional = true }
tauri-plugin-store = { version = "2.0", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "cookies", "socks", "gzip", "deflate"] }
url = "2.5"
base64 = "0.22"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
regex-lite = "0.1"
urlencoding = "2.1.3"
open = "5.3"
hex = "0.4"
discord-rich-presence = "0.2"
uuid = { version = "1.19.0", features = ["v4"] }
dirs = "5.0"
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
native-tls = "0.2"
tokio-native-tls = "0.3"
futures-util = "0.3"
http = "1.0"
rand = "0.8"

# Native client dependencies (winit is pure Rust - no CMake needed)
winit = "0.30"
softbuffer = "0.4"
webrtc = "0.14"
bytes = "1.5"
anyhow = "1.0"

# Full native client dependencies
clap = { version = "4.4", features = ["derive"] }
openh264 = "0.6"
cpal = "0.15"
parking_lot = "0.12"
crossbeam-channel = "0.5"

# GUI dependencies
eframe = "0.29"
egui_extras = { version = "0.29", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.15"

# Native streamer dependencies (hardware-accelerated video pipeline)
wgpu = { version = "23", optional = true }
bytemuck = { version = "1.14", features = ["derive"], optional = true }
pollster = { version = "0.4", optional = true }
ringbuf = { version = "0.4", optional = true }
sdl2 = { version = "0.38", features = ["bundled", "static-link", "raw-window-handle"], optional = true }
raw-window-handle = { version = "0.6", optional = true }
glyphon = { version = "0.7", optional = true }
# FFmpeg for NVDEC hardware decoding (h264_cuvid/hevc_cuvid)
# Install: download from https://github.com/BtbN/FFmpeg-Builds/releases
# Extract to C:\ffmpeg and set FFMPEG_DIR=C:\ffmpeg
ffmpeg-next = { version = "7", optional = true }
# Note: Audio decoding uses raw PCM for now; Opus support requires system libopus

# Windows Media Foundation for hardware video decoding (DXVA2/D3D11VA)
[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.58"
optional = true
features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Foundation",
    "Media_MediaProperties",
]

# macOS specific
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"

[features]
default = ["tauri-app"]
tauri-app = ["tauri", "tauri-plugin-shell", "tauri-plugin-http", "tauri-plugin-store", "custom-protocol", "tauri-build"]
custom-protocol = ["tauri/custom-protocol"]
native-client = []
native-streamer = ["wgpu", "bytemuck", "pollster", "ringbuf", "sdl2", "raw-window-handle", "windows", "glyphon", "ffmpeg-next"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
